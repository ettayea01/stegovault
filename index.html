<!doctype html>
<html lang="ary" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="خزن ميساج — خزن رسائل سرية داخل صور وملفات وخرجها، بكلمة سر إلا بغيتي." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23111827'/%3E%3Cstop offset='1' stop-color='%23111827'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M6 32c7-11 16-16 26-16s19 5 26 16c-7 11-16 16-26 16S13 43 6 32z' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='white'/%3E%3C/svg%3E" />
    <title>خزن ميساج</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #FFFFFF;
        --card: #FFFFFF;
        --card-2: #F7F7F8;
        --ink: #111827;
        --muted: #6B7280;
        --line: #E5E7EB;
        --field: #FFFFFF;
        --indigo: #111827;
        --violet: #111827;
        --ok: #16A34A;
        --danger: #DC2626;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
        --grad: #111827;
      }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px; line-height: 1.55;
      }
      button, input, textarea { font: inherit; }
      :focus-visible { outline: 3px solid rgba(17, 24, 39, 0.45); outline-offset: 2px; border-radius: 6px; }

      /* ---------- Header ---------- */
      header {
        position: sticky; top: 0; z-index: 10;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-bottom: 1px solid var(--line);
      }
      .header-in {
        max-width: 1020px; margin: 0 auto; padding: 12px 16px;
        display: flex; align-items: center; gap: 12px;
      }
      .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
      .logo .grad-text {
        background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      /* ---------- Layout ---------- */
      .wrap { max-width: 1020px; margin: 0 auto; padding: 24px 16px 48px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
      @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px;
        padding: 24px; box-shadow: var(--shadow);
      }
      .card h2 { margin: 0 0 14px; font-size: 1.3rem; font-weight: 750; letter-spacing: -0.01em; }
      .card h2 .step {
        display: inline-block; vertical-align: 2px; margin-inline-end: 9px;
        background: var(--grad); color: #fff; font-size: 0.8rem; font-weight: 800;
        width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%;
      }

      /* ---------- Controls ---------- */
      .drop {
        border: 2px dashed var(--line); border-radius: 14px; padding: 20px 16px; text-align: center;
        cursor: pointer; background: var(--card-2); transition: border-color 0.15s ease, background 0.15s ease;
      }
      .drop:hover, .drop.over { border-color: var(--indigo); }
      .drop .big { font-weight: 700; }
      .drop .small { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
      .drop img { max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 12px; display: none; margin-left: auto; margin-right: auto; }
      .fileinfo { margin-top: 10px; font-size: 0.88rem; color: var(--muted); overflow-wrap: anywhere; }
      .fileinfo b { color: var(--ink); }
      .kind {
        display: inline-block; background: var(--grad); color: #fff; border-radius: 999px;
        padding: 1px 10px; font-size: 0.75rem; font-weight: 700; margin-inline-end: 6px; vertical-align: 1px;
      }
      .cap { margin-top: 6px; font-size: 0.85rem; color: var(--indigo); font-weight: 600; }
      label.field { display: block; font-weight: 600; font-size: 0.9rem; margin: 16px 0 6px; }
      textarea, input[type="password"] {
        width: 100%; color: var(--ink); background: var(--field);
        border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px; min-height: 44px;
      }
      textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
      .count { font-size: 0.8rem; color: var(--muted); margin-top: 5px; text-align: end; font-variant-numeric: tabular-nums; }
      .btn {
        appearance: none; cursor: pointer; border-radius: 11px; padding: 11px 20px;
        font-weight: 700; font-size: 0.96rem; min-height: 44px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: filter 0.15s ease, opacity 0.15s ease;
      }
      .btn-primary { border: 0; background: var(--grad); color: #fff; width: 100%; margin-top: 18px; }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; filter: none; box-shadow: none; }
      .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .btn-ghost:hover { border-color: var(--indigo); }
      .status { font-size: 0.92rem; color: var(--muted); min-height: 1.4em; margin: 12px 0 0; }
      .status.err { color: var(--danger); font-weight: 600; }
      .status.ok { color: var(--ok); font-weight: 600; }
      .result {
        margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2);
        padding: 14px 16px; display: none;
      }
      .result.show { display: block; }
      .result .msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; }
      .result .row { display: flex; justify-content: flex-end; margin-top: 10px; }
      .hidden { display: none !important; }

      footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 30px; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-in">
        <div class="logo">
          <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg)"/><path d="M6 32c7-11 16-16 26-16s19 5 26 16c-7 11-16 16-26 16S13 43 6 32z" fill="none" stroke="white" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="white"/></svg>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="grid">
        <!-- ==================== HIDE ==================== -->
        <div class="card">
          <h2><span class="step">1</span>خزن ميساج</h2>

          <div class="drop" id="hideDrop" role="button" tabindex="0" aria-label="اختار ملف">
            <div class="big" id="hideDropBig">اختار ملف</div>
            <div class="small" id="hideDropSmall">ولا جرّ الملف هنا</div>
            <img id="hidePreview" alt="" />
          </div>
          <input type="file" id="hideFile" hidden />
          <div class="fileinfo" id="hideInfo"></div>
          <div class="cap" id="capHint"></div>

          <textarea id="msgText" placeholder="كتب ميساج هنا" maxlength="100000" aria-label="ميساج"></textarea>
          <div class="count" id="charCount">0 حرف</div>

          <label class="field" for="hidePassword">كلمة السر (اختيارية)</label>
          <input type="password" id="hidePassword" autocomplete="new-password" />

          <button class="btn btn-primary" id="btnHide" type="button" disabled>خزن و تيليشارجي</button>
          <p class="status" id="hideStatus"></p>
        </div>

        <!-- ==================== REVEAL ==================== -->
        <div class="card">
          <h2><span class="step">2</span>خرج ميساج</h2>

          <div class="drop" id="revealDrop" role="button" tabindex="0" aria-label="اختار ملف">
            <div class="big" id="revealDropBig">اختار ملف</div>
            <div class="small" id="revealDropSmall">ولا جرّ الملف هنا</div>
          </div>
          <input type="file" id="revealFile" hidden />
          <div class="fileinfo" id="revealInfo"></div>

          <label class="field" for="revealPassword">كلمة السر</label>
          <input type="password" id="revealPassword" autocomplete="current-password" />

          <button class="btn btn-primary" id="btnReveal" type="button" disabled>خرج</button>
          <p class="status" id="revealStatus"></p>

          <div class="result" id="revealResult">
            <div class="msg" id="revealText"></div>
            <div class="row"><button class="btn btn-ghost" id="btnCopy" type="button">انسخ</button></div>
          </div>
        </div>
      </div>
    </div>

    <script>
    'use strict';
    /* ================================================================
       StegoVault core — pure functions (also used by the Node tests).
       Payload framing (shared by both modes):
         "STG1" | flags(1, bit0 = encrypted) | u32 LE body length | body
       Encrypted body: salt(16) | iv(12) | AES-256-GCM ciphertext.
       ================================================================ */
    var STG_MAGIC = [0x53, 0x54, 0x47, 0x31]; /* "STG1" */
    var STG_HEADER = 9;                       /* magic 4 + flags 1 + length 4 */
    var STG_MARKER = null;                    /* built lazily (TextEncoder) */

    function utf8Encode(s) { return new TextEncoder().encode(s); }
    function utf8Decode(b) { return new TextDecoder().decode(b); }
    function markerBytes() {
      if (!STG_MARKER) STG_MARKER = utf8Encode('\n%%STG1%%\n');
      return STG_MARKER;
    }
    function hasMagic(b, off) {
      return b.length >= off + 4 &&
        b[off] === STG_MAGIC[0] && b[off + 1] === STG_MAGIC[1] &&
        b[off + 2] === STG_MAGIC[2] && b[off + 3] === STG_MAGIC[3];
    }
    /* Auto-detection: image files go to LSB mode, everything else to append mode. */
    function isImageFile(file) {
      if (!file) return false;
      if (file.type && file.type.indexOf('image/') === 0) return true;
      return /\.(png|jpe?g|gif|webp|bmp)$/i.test(file.name || '');
    }

    /* ---------- Framing ---------- */
    function framePayload(body, encrypted) {
      var out = new Uint8Array(STG_HEADER + body.length);
      out.set(STG_MAGIC, 0);
      out[4] = encrypted ? 1 : 0;
      new DataView(out.buffer).setUint32(5, body.length, true);
      out.set(body, STG_HEADER);
      return out;
    }
    function unframePayload(bytes) {
      if (!bytes || bytes.length < STG_HEADER || !hasMagic(bytes, 0)) {
        throw new Error('ما كاينة حتى رسالة مخبية هنا');
      }
      var len = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(5, true);
      if (bytes.length < STG_HEADER + len) {
        throw new Error('البيانات تضررات ولا ناقصة');
      }
      return { encrypted: (bytes[4] & 1) === 1, body: bytes.slice(STG_HEADER, STG_HEADER + len) };
    }

    /* ---------- Mode A: LSB embedding in RGBA pixel data ---------- */
    function lsbCapacityBytes(pixelCount) { return Math.floor(pixelCount * 3 / 8); }

    function embedLSB(data, framed) {
      var cap = lsbCapacityBytes(data.length / 4);
      if (framed.length > cap) {
        throw new Error('الرسالة خاصة ' + framed.length + ' بايت ولكن هاد الصورة تقدر تخبي غير ' +
          cap + ' بايت. جرّب صورة أكبر ولا رسالة أقصر.');
      }
      var bitIdx = 0, totalBits = framed.length * 8;
      for (var i = 0; i < data.length && bitIdx < totalBits; i++) {
        if (i % 4 === 3) continue; /* skip alpha */
        var bit = (framed[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
        data[i] = (data[i] & 0xFE) | bit;
        bitIdx++;
      }
      return data;
    }
    function readLSBBytes(data, nBytes) {
      var out = new Uint8Array(nBytes);
      var bitIdx = 0, totalBits = nBytes * 8;
      for (var i = 0; i < data.length && bitIdx < totalBits; i++) {
        if (i % 4 === 3) continue;
        out[bitIdx >> 3] |= (data[i] & 1) << (7 - (bitIdx & 7));
        bitIdx++;
      }
      return bitIdx === totalBits ? out : null;
    }
    function extractLSB(data) {
      var head = readLSBBytes(data, STG_HEADER);
      if (!head || !hasMagic(head, 0)) {
        throw new Error('ما كاينة حتى رسالة مخبية هنا');
      }
      var len = new DataView(head.buffer).getUint32(5, true);
      if (STG_HEADER + len > lsbCapacityBytes(data.length / 4)) {
        throw new Error('ما كاينة حتى رسالة مخبية هنا');
      }
      var framed = readLSBBytes(data, STG_HEADER + len);
      if (!framed) throw new Error('ما كاينة حتى رسالة مخبية هنا');
      return framed;
    }

    /* ---------- Mode B: append block at end of any file ---------- */
    function appendPayload(fileBytes, framed) {
      var marker = markerBytes();
      var out = new Uint8Array(fileBytes.length + marker.length + framed.length + 4);
      out.set(fileBytes, 0);
      out.set(marker, fileBytes.length);
      out.set(framed, fileBytes.length + marker.length);
      new DataView(out.buffer).setUint32(out.length - 4, framed.length, true);
      return out;
    }
    function findMarker(bytes) {
      var m = markerBytes();
      for (var i = 0; i + m.length <= bytes.length; i++) {
        var ok = true;
        for (var j = 0; j < m.length; j++) { if (bytes[i + j] !== m[j]) { ok = false; break; } }
        if (ok) return i;
      }
      return -1;
    }
    function extractAppended(bytes) {
      /* Fast path: framed length is repeated in the last 4 bytes. */
      if (bytes.length >= 4) {
        var fl = new DataView(bytes.buffer, bytes.byteOffset + bytes.length - 4, 4).getUint32(0, true);
        if (fl >= STG_HEADER && bytes.length >= 4 + fl) {
          var cand = bytes.slice(bytes.length - 4 - fl, bytes.length - 4);
          if (hasMagic(cand, 0)) return cand;
        }
      }
      /* Fallback: scan for the marker and read the framed block after it. */
      var idx = findMarker(bytes);
      if (idx >= 0) {
        var start = idx + markerBytes().length;
        if (bytes.length >= start + STG_HEADER) {
          var len = new DataView(bytes.buffer, bytes.byteOffset + start, bytes.length - start).getUint32(5, true);
          if (bytes.length >= start + STG_HEADER + len) {
            return bytes.slice(start, start + STG_HEADER + len);
          }
        }
      }
      throw new Error('ما كاينة حتى رسالة مخبية هنا');
    }

    /* ---------- Encryption (AES-256-GCM, PBKDF2-SHA-256 100k) ---------- */
    function deriveKey(password, salt, usages) {
      return crypto.subtle.importKey('raw', utf8Encode(password), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, usages);
        });
    }
    function encryptBody(text, password) {
      var plain = utf8Encode(text);
      if (!password) return Promise.resolve({ body: plain, encrypted: false });
      var salt = crypto.getRandomValues(new Uint8Array(16));
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return deriveKey(password, salt, ['encrypt']).then(function (key) {
        return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plain);
      }).then(function (ctBuf) {
        var ct = new Uint8Array(ctBuf);
        var body = new Uint8Array(16 + 12 + ct.length);
        body.set(salt, 0); body.set(iv, 16); body.set(ct, 28);
        return { body: body, encrypted: true };
      });
    }
    function decryptBody(body, encrypted, password) {
      if (!encrypted) return Promise.resolve(utf8Decode(body));
      if (!password) {
        return Promise.reject(new Error('هاد الرسالة مشفرة — دخل كلمة السر'));
      }
      if (body.length < 28 + 16) {
        return Promise.reject(new Error('كلمة السر غلاطة — ولا الملف تضرر'));
      }
      var salt = body.slice(0, 16), iv = body.slice(16, 28), ct = body.slice(28);
      return deriveKey(password, salt, ['decrypt']).then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
      }).then(function (plainBuf) {
        return utf8Decode(new Uint8Array(plainBuf));
      }, function () {
        throw new Error('كلمة السر غلاطة — ولا الملف تضرر');
      });
    }

    /* Exposed for testing and future reuse. */
    globalThis.Stego = {
      framePayload: framePayload, unframePayload: unframePayload,
      embedLSB: embedLSB, extractLSB: extractLSB, lsbCapacityBytes: lsbCapacityBytes,
      appendPayload: appendPayload, extractAppended: extractAppended,
      encryptBody: encryptBody, decryptBody: decryptBody,
      HEADER_LEN: STG_HEADER
    };

    /* ================================================================
       UI (browser only)
       ================================================================ */
    if (typeof document !== 'undefined') (function () {
      function $(id) { return document.getElementById(id); }
      function setStatus(el, msg, kind) { el.textContent = msg; el.className = 'status' + (kind ? ' ' + kind : ''); }
      function fmtBytes(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / (1024 * 1024)).toFixed(2) + ' MB';
      }
      function downloadBlob(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
      }
      function stegoName(name, forcePng) {
        var dot = name.lastIndexOf('.');
        var base = dot > 0 ? name.slice(0, dot) : (name || 'file');
        var ext = dot > 0 ? name.slice(dot) : '';
        return forcePng ? base + '-stego.png' : base + '-stego' + ext;
      }
      function showInfo(el, kind, name, rest) {
        el.innerHTML = '';
        var tag = document.createElement('span');
        tag.className = 'kind'; tag.textContent = kind;
        var b = document.createElement('b'); b.textContent = name;
        el.appendChild(tag); el.appendChild(b);
        el.appendChild(document.createTextNode(rest));
      }
      var lastPreviewUrl = null;
      function loadImageFile(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () {
            try {
              var canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              if (lastPreviewUrl) URL.revokeObjectURL(lastPreviewUrl);
              lastPreviewUrl = url;
              resolve({ imageData: imageData, canvas: canvas, previewUrl: url });
            } catch (e) { URL.revokeObjectURL(url); reject(e); }
          };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('ما قدرناش نقراو هاد الصورة')); };
          img.src = url;
        });
      }

      var hideKind = null;    /* 'image' | 'file' | null (auto-detected) */
      var hideImage = null;   /* {imageData, canvas, name} */
      var hideCarrier = null; /* {bytes:Uint8Array, name, type} */
      var revealFileObj = null;

      /* ---------- Drop zones ---------- */
      function wireDrop(zone, input, onFile) {
        zone.addEventListener('click', function () { input.click(); });
        zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
        zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
        zone.addEventListener('drop', function (e) {
          e.preventDefault(); zone.classList.remove('over');
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) onFile(f);
        });
        input.addEventListener('change', function () {
          var f = input.files && input.files[0];
          input.value = '';
          if (f) onFile(f);
        });
      }

      /* ---------- Hide side ---------- */
      function updateCapHint() {
        var el = $('capHint');
        if (hideKind === 'image' && hideImage) {
          var cap = lsbCapacityBytes(hideImage.imageData.width * hideImage.imageData.height);
          var plain = Math.max(0, cap - STG_HEADER);
          el.textContent = 'تقدر تخبي حتى ~' + plain.toLocaleString() + ' حرف';
        } else { el.textContent = ''; }
      }
      function updateCount() {
        var t = $('msgText').value;
        $('charCount').textContent = t.length + ' حرف';
        updateButtons();
      }
      function updateButtons() {
        var hasCarrier = hideKind === 'image' ? !!hideImage : (hideKind === 'file' ? !!hideCarrier : false);
        $('btnHide').disabled = !(hasCarrier && $('msgText').value.length > 0);
        $('btnReveal').disabled = !revealFileObj;
      }
      function onHideFile(file) {
        setStatus($('hideStatus'), '', '');
        if (isImageFile(file)) {
          loadImageFile(file).then(function (res) {
            hideKind = 'image'; hideCarrier = null;
            hideImage = { imageData: res.imageData, canvas: res.canvas, name: file.name };
            var prev = $('hidePreview');
            prev.src = res.previewUrl; prev.style.display = 'block';
            showInfo($('hideInfo'), 'صورة', file.name,
              ' — ' + res.imageData.width + ' × ' + res.imageData.height + ' · ' + fmtBytes(file.size));
            updateCapHint(); updateButtons();
          }).catch(function (err) {
            hideKind = null; hideImage = null; updateCapHint(); updateButtons();
            setStatus($('hideStatus'), err.message || 'ما قدرناش نقراو هاد الصورة', 'err');
          });
        } else {
          file.arrayBuffer().then(function (ab) {
            hideKind = 'file'; hideImage = null;
            hideCarrier = { bytes: new Uint8Array(ab), name: file.name, type: file.type || 'application/octet-stream' };
            $('hidePreview').style.display = 'none';
            showInfo($('hideInfo'), 'ملف', file.name, ' — ' + fmtBytes(file.size));
            updateCapHint(); updateButtons();
          }).catch(function () {
            hideKind = null; hideCarrier = null; updateButtons();
            setStatus($('hideStatus'), 'ما قدرناش نقراو هاد الملف', 'err');
          });
        }
      }
      wireDrop($('hideDrop'), $('hideFile'), onHideFile);
      $('msgText').addEventListener('input', updateCount);

      $('btnHide').addEventListener('click', function () {
        var text = $('msgText').value;
        var pw = $('hidePassword').value;
        if (!text) { setStatus($('hideStatus'), 'كتب الرسالة أولاً', 'err'); return; }
        $('btnHide').disabled = true;
        setStatus($('hideStatus'), 'كنخبيو الرسالة…', '');
        encryptBody(text, pw).then(function (enc) {
          var framed = framePayload(enc.body, enc.encrypted);
          if (hideKind === 'image') {
            if (!hideImage) throw new Error('اختار ملف أولاً');
            var copy = new Uint8ClampedArray(hideImage.imageData.data);
            embedLSB(copy, framed); /* throws a clear capacity error when too big */
            var ctx = hideImage.canvas.getContext('2d');
            ctx.putImageData(new ImageData(copy, hideImage.imageData.width, hideImage.imageData.height), 0, 0);
            hideImage.canvas.toBlob(function (blob) {
              if (!blob) { setStatus($('hideStatus'), 'ما قدرناش نصايبو PNG', 'err'); $('btnHide').disabled = false; return; }
              downloadBlob(blob, stegoName(hideImage.name, true));
              setStatus($('hideStatus'), 'تخبات الرسالة — تحمّل الملف', 'ok');
              $('btnHide').disabled = false;
            }, 'image/png');
          } else {
            if (!hideCarrier) throw new Error('اختار ملف أولاً');
            var out = appendPayload(hideCarrier.bytes, framed);
            downloadBlob(new Blob([out], { type: hideCarrier.type }), stegoName(hideCarrier.name, false));
            setStatus($('hideStatus'), 'تخبات الرسالة — تحمّل الملف', 'ok');
            $('btnHide').disabled = false;
          }
        }).catch(function (err) {
          setStatus($('hideStatus'), err && err.message ? err.message : 'وقع شي مشكل', 'err');
          $('btnHide').disabled = false;
        });
      });

      /* ---------- Reveal side ---------- */
      function onRevealFile(file) {
        revealFileObj = file;
        showInfo($('revealInfo'), isImageFile(file) ? 'صورة' : 'ملف', file.name, ' — ' + fmtBytes(file.size));
        $('revealResult').classList.remove('show');
        setStatus($('revealStatus'), '', '');
        updateButtons();
      }
      wireDrop($('revealDrop'), $('revealFile'), onRevealFile);

      $('btnReveal').addEventListener('click', function () {
        if (!revealFileObj) { setStatus($('revealStatus'), 'اختار ملف أولاً', 'err'); return; }
        var file = revealFileObj;
        var pw = $('revealPassword').value;
        $('btnReveal').disabled = true;
        setStatus($('revealStatus'), 'كنقلبو على الرسالة…', '');
        $('revealResult').classList.remove('show');
        var framedPromise;
        if (isImageFile(file)) {
          /* Image: try the pixels (LSB) first, then an appended block in the same file. */
          framedPromise = loadImageFile(file).then(function (res) {
            try { return extractLSB(res.imageData.data); }
            catch (e) {
              return file.arrayBuffer().then(function (ab) { return extractAppended(new Uint8Array(ab)); });
            }
          }, function () {
            return file.arrayBuffer().then(function (ab) { return extractAppended(new Uint8Array(ab)); });
          });
        } else {
          framedPromise = file.arrayBuffer().then(function (ab) { return extractAppended(new Uint8Array(ab)); });
        }
        framedPromise.then(function (framed) {
          var un = unframePayload(framed);
          return decryptBody(un.body, un.encrypted, pw);
        }).then(function (text) {
          $('revealText').textContent = text;
          $('revealResult').classList.add('show');
          setStatus($('revealStatus'), 'هاهي الرسالة', 'ok');
          $('btnReveal').disabled = false;
        }).catch(function (err) {
          setStatus($('revealStatus'), err && err.message ? err.message : 'وقع شي مشكل', 'err');
          $('btnReveal').disabled = false;
        });
      });

      $('btnCopy').addEventListener('click', function () {
        var text = $('revealText').textContent;
        function done() { setStatus($('revealStatus'), 'تنسخات', 'ok'); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { setStatus($('revealStatus'), 'ما تنسخاتش — اختار النص بيدك', 'err'); });
        } else {
          var r = document.createRange(); r.selectNodeContents($('revealText'));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          try { document.execCommand('copy'); done(); } catch (e) { setStatus($('revealStatus'), 'ما تنسخاتش — اختار النص بيدك', 'err'); }
          sel.removeAllRanges();
        }
      });

      updateCount();
    })();
    </script>
  </body>
</html>
